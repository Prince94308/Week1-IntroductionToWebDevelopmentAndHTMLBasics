<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<center>
<body>
    <pre>
    <div >
        <h1>Admission Form</h1>
        <form action="/submit-admission" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="course">Course Applied For:</label>
            <select id="course" name="course" required>
                <option value="">Select a course</option>
                <option value="bsc">B.tech</option>
                <option value="msc">BSc</option>
                <option value="phd">M.tech</option>
            </select>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>

            <button type="submit">Submit Admission Form</button>
        </form>
    </pre>
    </div>
</center>
</body>
</html>
